name: Build and deploy mobile game
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Upload website build
        uses: actions/upload-artifact@v4
        with:
          name: mahjong-hulu2-mobile-dist
          path: dist/
          if-no-files-found: error
      - name: Deploy to Cloudflare Pages
        if: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=mahjong-hulu2-mobile
      - name: Deployment setup required
        if: ${{ vars.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: |
          echo "Build succeeded. Cloudflare Pages deployment is not configured yet."
          echo "Add repository variable CLOUDFLARE_ACCOUNT_ID and secret CLOUDFLARE_API_TOKEN."
