name: Build and deploy mobile game
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Upload website build
        uses: actions/upload-artifact@v4
        with:
          name: mahjong-hulu2-mobile-dist
          path: dist/
          if-no-files-found: error
      - name: Deploy to Cloudflare Workers
        if: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Build succeeded; Cloudflare deployment skipped because CLOUDFLARE_API_TOKEN is not configured."
            exit 0
          fi
          npx --yes wrangler@latest deploy
      - name: Deployment setup required
        if: ${{ vars.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: |
          echo "Build succeeded. Add repository variable CLOUDFLARE_ACCOUNT_ID and secret CLOUDFLARE_API_TOKEN to enable deployment."
