name: Build and publish mobile game
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-game-publish
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build production site
        run: npm run build
      - name: Verify production output
        run: |
          test -s dist/index.html
          test -d dist/assets
          echo "Production build contains index.html and assets."
      - name: Archive build
        uses: actions/upload-artifact@v4
        with:
          name: mahjong-hulu2-mobile-dist
          path: dist/
          if-no-files-found: error
      - name: Publish static site branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          force_orphan: true
          enable_jekyll: false
