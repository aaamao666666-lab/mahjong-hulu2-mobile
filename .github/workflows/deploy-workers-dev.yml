name: Deploy Mahjong HULU2 to Cloudflare Workers

on:
  push:
    branches:
      - feature/mahjong-hulu2-3d-upgrade
    paths:
      - "src/**"
      - "public/mahjong/**"
      - "public/assets/mahjong-hulu2/ui/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-workers-dev.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mahjong-hulu2-workers-dev
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/mahjong-hulu2-3d-upgrade
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Verify original Mahjong PNG folders
        shell: bash
        run: |
          set -euo pipefail
          test -d public/mahjong/normal
          test -d public/mahjong/gold
          test "$(find public/mahjong/normal -maxdepth 1 -type f -name '*.png' | wc -l)" -gt 0
          test "$(find public/mahjong/gold -maxdepth 1 -type f -name '*.png' | wc -l)" -gt 0
      - name: Run game engine tests
        run: npm test
      - name: Build production bundle
        run: npm run build
      - name: Verify build output
        run: test -s dist/index.html && test -d dist/assets
      - name: Deploy to this project's workers.dev
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc
