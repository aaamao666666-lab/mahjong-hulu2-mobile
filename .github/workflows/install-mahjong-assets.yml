name: Install Mahjong HULU2 PNG assets and verify build
on:
  push:
    branches:
      - feature/mahjong-hulu2-3d-upgrade
    paths:
      - "install-assets.trigger"
permissions:
  contents: write
jobs:
  install-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mahjong-hulu2-3d-upgrade
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract only individual PNG assets
        run: |
          python - <<'PY'
          import os, zipfile
          packs = [
            ("01_UI界面图片_PNG.zip", "ui-original"),
            ("02_中奖与免费旋转特效_PNG.zip", "win-free"),
            ("03_旋转按钮动画_PNG.zip", "spin"),
            ("04_麻将普通与金色单张牌图_PNG.zip", "tiles"),
          ]
          root = "public/assets/mahjong-hulu2/effects"
          skipped = []
          kept = 0
          for archive, folder in packs:
              if not os.path.isfile(archive):
                  raise SystemExit("Missing source archive: " + archive)
              with zipfile.ZipFile(archive) as z:
                  for name in z.namelist():
                      if not name.lower().endswith(".png"):
                          continue
                      low = name.lower()
                      if any(term in low for term in ("reference_sheet", "full_sheet", "sequence")):
                          skipped.append(archive + ":" + name)
                          continue
                      rel = name.split("/", 1)[-1] if "/" in name else name
                      target = os.path.join(root, folder, rel)
                      os.makedirs(os.path.dirname(target), exist_ok=True)
                      with z.open(name) as src, open(target, "wb") as dst:
                          dst.write(src.read())
                      kept += 1
          print("Independent PNG files installed:", kept)
          print("Reference/sheet/sequence files excluded:", len(skipped))
          for item in skipped:
              print("EXCLUDED", item)
          if kept < 70:
              raise SystemExit("PNG count lower than expected; refusing to commit")
          PY
      - name: Commit extracted PNG assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/mahjong-hulu2/effects
          if git diff --cached --quiet; then
            echo "No new asset files to commit"
          else
            git commit -m "Add filtered individual Mahjong PNG assets"
            git push origin HEAD:feature/mahjong-hulu2-3d-upgrade
          fi
      - name: Build and test
        run: |
          npm install
          npm test
          npm run build
          test -s dist/index.html
